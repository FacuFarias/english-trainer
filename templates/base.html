<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}English Trainer{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1b2e;
            --bg-card: #232440;
            --bg-card-hover: #2a2b4a;
            --accent: #6c63ff;
            --accent-light: #8b83ff;
            --text: #e0e0e0;
            --text-muted: #8a8aa0;
            --border: #33345a;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --info: #3498db;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 14px;
        }
        .navbar {
            background: var(--bg-card) !important;
            border-bottom: 1px solid var(--border);
            padding: 0.5rem 0;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-light) !important;
        }
        .nav-link {
            color: var(--text-muted) !important;
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem !important;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--text) !important;
            background: var(--bg);
        }
        main.container {
            max-width: 960px;
            padding-top: 1.5rem;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
        }
        .card-header {
            background: transparent;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.75rem 1rem;
        }
        .card-body {
            padding: 1rem;
        }
        .card-footer {
            background: transparent;
            border-top: 1px solid var(--border);
            padding: 0.6rem 1rem;
        }
        .btn {
            font-size: 0.85rem;
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            font-weight: 500;
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background: var(--accent-light);
            border-color: var(--accent-light);
        }
        .stat-number {
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1;
        }
        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }
        .review-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-size: 1.15rem;
            line-height: 1.6;
        }
        .review-card .card-text {
            white-space: pre-wrap;
        }
        .review-card img {
            max-height: 160px;
            border-radius: 6px;
        }
        .btn-ease {
            min-width: 75px;
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            border: none;
        }
        .badge {
            font-weight: 500;
            font-size: 0.75rem;
        }
        .table {
            color: var(--text);
            font-size: 0.85rem;
        }
        .table thead th {
            border-color: var(--border);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--text-muted);
        }
        .table td {
            border-color: var(--border);
            vertical-align: middle;
        }
        .form-control, .form-select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.85rem;
        }
        .form-control:focus, .form-select:focus {
            background: var(--bg);
            border-color: var(--accent);
            color: var(--text);
            box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.15);
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 500;
        }
        .form-text {
            font-size: 0.75rem;
        }
        .alert {
            font-size: 0.85rem;
            border-radius: 8px;
        }
        .display-4 {
            font-size: 1.8rem;
        }
        .progress-ring {
            width: 48px;
            height: 48px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-braces-asterisk"></i> EnglishTrainer
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list text-light"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-house-fill"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/decks"><i class="bi bi-layers-fill"></i> Decks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/import"><i class="bi bi-cloud-upload-fill"></i> Import</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/stats"><i class="bi bi-bar-chart-fill"></i> Stats</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
